<header class="section-heading" [class.section-heading--left]="align === 'left'"
    [class.section-heading--center]="align === 'center'">
    <div class="section-heading__eyebrow">
        <span class="section-heading__line"></span>

        <span class="section-heading__eyebrow-text">
            {{ eyebrow }}
        </span>

        <span class="section-heading__line"></span>
    </div>

    <h2 class="section-heading__title" [id]="headingId || null">
        @if (highlightedText) {
        {{ titleWithoutHighlight }}
        <span class="section-heading__highlight">
            {{ highlightedText }}
        </span>
        } @else {
        {{ title }}
        }
    </h2>

    @if (description) {
    <p class="section-heading__description">
        {{ description }}
    </p>
    }
</header>
