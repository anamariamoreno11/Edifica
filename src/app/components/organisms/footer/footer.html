<footer class="footer">
    <div class="container footer__grid">
        <div class="footer__brand">
            <app-logo variant="dark" size="footer" link="#inicio"></app-logo>
        </div>

        <app-footer-column title="Navegación" [links]="navigationLinks"></app-footer-column>

        <app-footer-column title="Servicios" [links]="serviceLinks"></app-footer-column>

        <section class="footer__contact">
            <h3 class="footer__title">
                Contacto
            </h3>

            <div class="footer__contact-list">
                <app-footer-contact-item iconSource="/images/icons/social/whatsapp-white.png" value="+57 314 604 5189"
                    href="https://wa.me/573146045189" [external]="true">
                </app-footer-contact-item>
            
                <app-footer-contact-item iconSource="/images/icons/social/email-white.png" value="contacto@edificaingenieria.com"
                    href="mailto:contacto@edificaingenieria.com">
                </app-footer-contact-item>
            
                <app-footer-contact-item iconSource="/images/icons/social/instagram-white.png"
                    value="@edifica_ingenieria_estructural" href="https://www.instagram.com/edifica_ingenieria_estructural/"
                    [external]="true">
                </app-footer-contact-item>
            </div>
        </section>
    </div>

    <div class="container footer__bottom">
        <p>
            © {{ currentYear }} Edifica Ingeniería Estructural S.A.S.
            Todos los derechos reservados.
        </p>
    </div>
</footer>
