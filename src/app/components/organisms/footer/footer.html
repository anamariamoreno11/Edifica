<footer class="footer">
    <div class="container footer__grid">
        <div class="footer__brand">
            <app-logo variant="dark" size="footer" link="#inicio"></app-logo>
        </div>

        <app-footer-column title="Navegación" [links]="navigationLinks"></app-footer-column>

        <app-footer-column title="Servicios" [links]="serviceLinks"></app-footer-column>

        <section class="footer__contact">
            <h3 class="footer__title">
                Contacto
            </h3>

            <div class="footer__contact-list">
                <app-footer-contact-item iconSource="/images/icons/contact/phone-white.png" value="+57 313 860 9299"
                    href="https://wa.me/573138609299" [external]="true"></app-footer-contact-item>

                <app-footer-contact-item iconSource="/images/icons/contact/email-white.png"
                    value="edificaingenieria@outlook.com"
                    href="mailto:edificaingenieria@outlook.com"></app-footer-contact-item>

                <app-footer-contact-item iconSource="/images/icons/contact/instagram-white.png"
                    value="@edifica.ingenieria" href="https://www.instagram.com/"
                    [external]="true"></app-footer-contact-item>
            </div>
        </section>
    </div>

    <div class="container footer__bottom">
        <p>
            © {{ currentYear }} Edifica Ingeniería Estructural S.A.S.
            Todos los derechos reservados.
        </p>
    </div>
</footer>
